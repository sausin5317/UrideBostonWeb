# Google Cloud Build Pipeline for Uride Boston Landing Page
# Project: uridebostonweb
# Service: uride-boston-web

steps:
  # Step 1: Build the Docker container image
  - name: 'gcr.io/cloud-builders/docker'
    args:
      - 'build'
      - '-t'
      - 'gcr.io/$PROJECT_ID/uride-boston-web:$COMMIT_SHA'
      - '-t'
      - 'gcr.io/$PROJECT_ID/uride-boston-web:latest'
      - '.'

  # Step 2: Push the image to Container Registry
  - name: 'gcr.io/cloud-builders/docker'
    args:
      - 'push'
      - 'gcr.io/$PROJECT_ID/uride-boston-web:$COMMIT_SHA'

  - name: 'gcr.io/cloud-builders/docker'
    args:
      - 'push'
      - 'gcr.io/$PROJECT_ID/uride-boston-web:latest'

  # Step 3: Deploy container to Google Cloud Run
  - name: 'gcr.io/google.com/cloudsdktool/cloud-sdk'
    entrypoint: gcloud
    args:
      - 'run'
      - 'deploy'
      - 'uride-boston-web'
      - '--image'
      - 'gcr.io/$PROJECT_ID/uride-boston-web:$COMMIT_SHA'
      - '--region'
      - 'us-east1'
      - '--platform'
      - 'managed'
      - '--allow-unauthenticated'
      - '--port'
      - '8080'

images:
  - 'gcr.io/$PROJECT_ID/uride-boston-web:$COMMIT_SHA'
  - 'gcr.io/$PROJECT_ID/uride-boston-web:latest'

options:
  logging: CLOUD_LOGGING_ONLY
